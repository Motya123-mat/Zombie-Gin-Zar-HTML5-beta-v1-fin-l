<body>

<div id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">
        <div>🧟 Zombie Gin Zar</div>
        <div class="loader-version">v1.0 FINAL</div>
    </div>
</div>

<div id="notification" class="notification"></div>
<div id="error-container"></div>
<div id="game"></div>
<div id="admin-panel"></div>

<script>
// ============================================
// 🎮 ZOMBIE GIN ZAR v1.0 FINAL
// ============================================

const VERSION = '1.0 FINAL';
const SAVE_VERSION = 1;
const STORAGE_KEY = 'zgz_save_v' + SAVE_VERSION;
const ADMIN_STORAGE_KEY = 'zgz_admin';
const LOGS_KEY = 'zgz_logs';
const PLAYERS_PREFIX = 'zgz_player_';
const ADMIN_PASSWORD = '9260ai91';

// Flag to prevent multiple initializations
let gameInitialized = false;
// ========== STORAGE ==========
const Storage = {
    available: true,
    data: {},
    init() {
        try {
            localStorage.setItem('_test_', '1');
            localStorage.removeItem('_test_');
            this.available = true;
            console.log('✅ localStorage available');
        } catch(e) { 
            this.available = false;
            console.log('ℹ️ Using memory storage (CodeRun IDE)');
        }
    },
    set(k, v) { 
        try { 
            if(this.available) localStorage.setItem(k,v); 
            this.data[k]=v; 
            return true; 
        } catch(e) { 
            this.data[k]=v; 
            return false; 
        } 
    },
    get(k, d=null) { 
        try { 
            if(this.available) return localStorage.getItem(k); 
            return this.data[k]||d; 
        } catch(e) { 
            return this.data[k]||d; 
        } 
    },
    remove(k) { 
        try { 
            if(this.available) localStorage.removeItem(k); 
            delete this.data[k]; 
        } catch(e) { 
            delete this.data[k]; 
        } 
    }
};

// ========== LOGGER ==========
const Logger = {
    logs: [],
    init() { 
        try { 
            const s=Storage.get(LOGS_KEY);             if(s) this.logs=JSON.parse(s); 
        } catch(e){} 
    },
    add(a,d='') { 
        this.logs.unshift({t:Date.now(),a,d,p:window.player?.id||'?'}); 
        if(this.logs.length>500)this.logs.pop(); 
        this.save(); 
    },
    save() { Storage.set(LOGS_KEY, JSON.stringify(this.logs)); },
    clear() { this.logs=[]; this.save(); },
    render(c) { 
        if(!c)return; 
        c.innerHTML=this.logs.slice(0,50).map(l=>`<div class="log-entry"><span class="log-time">[${new Date(l.t).toLocaleString('ru-RU')}]</span> <span class="log-action">${l.a}</span>: ${l.d}</div>`).join('')||'<p style="text-align:center;color:#8bc34a;">Нет логов</p>'; 
    }
};

// ========== NOTIFICATION ==========
function notify(msg, type='success') {
    const n = document.getElementById('notification');
    if(!n) return;
    n.textContent = msg;
    n.className = 'notification ' + type + ' show';
    setTimeout(() => n.classList.remove('show'), 3000);
}

// ========== GLOBAL ==========
let player = null;
let adminData = { bannedIds: [], testers: [], dbEnabled: true };
let battle = { 
    mode:null, 
    zombies:[], 
    baseHp:5000, 
    curIdx:0, 
    selWeapon:null, 
    wave:0, 
    lastAttack:{}, 
    cooldownIntervals:{},
    timeLeft:60,
    timerInterval:null
};

// ========== INIT ==========
function startGame() {
    // Prevent multiple initializations
    if(gameInitialized) {
        console.log('⚠️ Game already initialized');
        return;
    }
    gameInitialized = true;
        console.log('🎮 Starting Zombie Gin Zar v' + VERSION);
    
    Storage.init();
    Logger.init();
    
    // Миграция
    ['zgz_save','zgz_save_v1'].forEach(k=>{
        try {
            const d = Storage.get(k);
            if(d) { 
                Storage.set(STORAGE_KEY, d); 
                Storage.remove(k); 
                Logger.add('MIGRATE',k); 
            }
        } catch(e){}
    });
    
    // Скрываем загрузчик через 800мс

    // Cooldown system
    function startCooldown(weaponName, cooldownMs, callback) {
        if(battle.cooldownIntervals[weaponName]) {
            clearInterval(battle.cooldownIntervals[weaponName]);
        }
        
        const startTime = Date.now();
        const endTime = startTime + cooldownMs;
                battle.cooldownIntervals[weaponName] = setInterval(() => {
            const now = Date.now();
            const remaining = Math.max(0, endTime - now);
            
            const weaponEl = document.querySelector(`[data-wep="${weaponName}"]`);
            if(weaponEl) {
                const overlay = weaponEl.querySelector('.cooldown-overlay');
                const text = weaponEl.querySelector('.cooldown-text');
                if(overlay) {
                    const percent = (remaining / cooldownMs) * 100;
                    overlay.style.height = percent + '%';
                }
                if(text) {
                    text.textContent = (remaining / 1000).toFixed(1) + 'с';
                }
                weaponEl.classList.add('cooldown');
            }
            
            if(remaining <= 0) {
                clearInterval(battle.cooldownIntervals[weaponName]);
                delete battle.cooldownIntervals[weaponName];
                
                if(weaponEl) {
                    const overlay = weaponEl.querySelector('.cooldown-overlay');
                    if(overlay) overlay.style.height = '0%';
                    weaponEl.classList.remove('cooldown');
                }
                
                if(callback) callback();
            }
        }, 100);
    }

        return battle.cooldownIntervals[weaponName] !== undefined;

        // ========== BATTLE SYSTEM ==========
        function startBattle(mode) {
            battle.mode = mode;
            battle.curIdx = 0;
            battle.selWeapon = player.weapons[0]?.name || 'Нож кухонный';
            clearAllCooldowns();
            
            if(mode === 'kill25') {
                battle.zombies = [];
                for(let i=0; i<25; i++) {
                    const z = ZOMBIES[Math.floor(Math.random() * Math.min(3, ZOMBIES.length))];
                    battle.zombies.push({...z, curHp: z.hp});
                }
            } else if(mode === 'farm') {
                if(player.money < 15000) {
                    notify('❌ Нужно 15000 монет для фарма','error');
                    return;
                }
                player.money -= 15000;
                save();
                updateUI();
                battle.zombies = [];
                for(let i=0; i<100; i++) {
                    battle.zombies.push({...ZOMBIES[0], curHp: ZOMBIES[0].hp});
                }
            } else if(mode === 'randomZombie') {
                const z = ZOMBIES[Math.floor(Math.random() * ZOMBIES.length)];
                battle.zombies = [{...z, curHp: z.hp}];
            } else if(mode === '60seconds') {                battle.timeLeft = 60;
                battle.zombies = [{...ZOMBIES[0], curHp: ZOMBIES[0].hp}];
                if(battle.timerInterval) clearInterval(battle.timerInterval);
                battle.timerInterval = setInterval(() => {
                    battle.timeLeft--;
                    if(battle.timeLeft <= 0) {
                        clearInterval(battle.timerInterval);
                        exitBattle();
                        notify('⏱️ Время вышло!','error');
                    } else {
                        renderBattle();
                    }
                }, 1000);
            } else {
                battle.zombies = [{...ZOMBIES[0], curHp: ZOMBIES[0].hp}];
            }
            
            switchTab('battle');
            renderBattle();
            Logger.add('BATTLE',mode);
        }
        
        function renderBattle() {
            if(!battle.mode || !el.battleContent) return;
            
            const z = battle.zombies[battle.curIdx];
            if(!z) {
                el.battleContent.innerHTML = '<h2 style="text-align:center;color:#8bc34a;margin:40px 0;">🎉 ПОБЕДА!</h2><button class="back-btn" id="back-from-battle" style="display:block;margin:0 auto;">В меню</button>';
                return;
            }
            
            const weps = player.weapons.map(w=>w.name);
            
            el.battleContent.innerHTML = `
                ${battle.mode==='60seconds'?'<div class="battle-timer">⏱️ '+battle.timeLeft+'с</div>':''}
                <div class="zombie-stats" id="current-zombie">
                    <h2>${z.name}</h2>
                    <p>❤️ ${z.curHp}/${z.hp} HP</p>
                    <p>💀 Урон: ${z.dmg}</p>
                    <p>🏆 Награда: ${z.reward}💰</p>
                </div>
                <div class="weapon-selector">
                    ${weps.map(n=>{
                        const w = WEAPONS.find(x=>x.name===n)||TESTER_HAMMER;
                        const s = n===battle.selWeapon?'selected':'';
                        const onCd = isOnCooldown(n);
                        return '<div class="weapon-option '+s+(onCd?' cooldown':'')+'" data-wep="'+n+'">'+
                            '<div class="cooldown-overlay" style="height:0%"></div>'+
                            '<div class="cooldown-text">'+(onCd?'0.0с':'')+'</div>'+
                            '<div>'+n+'</div>'+                            '<div style="font-size:12px;margin-top:5px;">⚔️ '+w.damage+' | ⏱️ '+(w.cd/1000)+'с</div>'+
                            '</div>';
                    }).join('')}
                </div>
                <button class="attack-btn" id="attack-btn">⚔️ АТАКА</button>
            `;
            
            document.querySelectorAll('.weapon-option').forEach(e=>{
                e.addEventListener('click',function(){
                    if(!this.classList.contains('cooldown')) {
                        battle.selWeapon = this.dataset.wep;
                        renderBattle();
                    }
                });
            });
            
            document.getElementById('attack-btn')?.addEventListener('click',()=>{
                const wd = WEAPONS.find(w=>w.name===battle.selWeapon)||TESTER_HAMMER;
                if(!wd) return;
                
                if(isOnCooldown(battle.selWeapon)) {
                    notify('⏱️ Оружие перезаряжается!','error');
                    return;
                }
                
                const z = battle.zombies[battle.curIdx];
                if(!z) return;
                
                const bonus = 1 + (player.prestigeBonus * 0.1);
                const damage = Math.floor(wd.damage * bonus);
                z.curHp -= damage;
                
                if(wd.cd > 0) {
                    startCooldown(battle.selWeapon, wd.cd, () => {
                        renderBattle();
                    });
                }
                
                const playerWeapon = player.weapons.find(w=>w.name===battle.selWeapon);
                if(playerWeapon && wd.maxDur !== -1) {
                    playerWeapon.durability--;
                    if(playerWeapon.durability <= 0) {
                        player.weapons = player.weapons.filter(w=>w.name!==battle.selWeapon);
                        if(player.weapons.length === 0) {
                            player.weapons.push({name:'Нож кухонный',durability:-1,skin:null});
                        }
                        battle.selWeapon = player.weapons[0]?.name || 'Нож кухонный';
                        notify('⚠️ Оружие сломалось!','error');
                    }
                }                
                const zd = document.getElementById('current-zombie');
                if(zd) {
                    zd.style.animation = 'none';
                    zd.offsetHeight;
                    zd.style.animation = 'shake 0.2s';
                }
                
                if(z.curHp <= 0) {
                    player.money += z.reward;
                    player.totalKills++;
                    
                    player.dailyTasks.forEach(t=>{
                        if(!t.completed && t.type==='kill') {
                            t.progress = Math.min(t.target, t.progress + 1);
                            if(t.progress >= t.target) t.completed = true;
                        }
                        if(!t.completed && t.type==='money') {
                            t.progress = Math.min(t.target, t.progress + z.reward);
                            if(t.progress >= t.target) t.completed = true;
                        }
                    });
                    
                    save();
                    updateUI();
                    
                    battle.curIdx++;
                    if(battle.curIdx >= battle.zombies.length) {
                        if(battle.mode === 'randomZombie') {
                            const nz = ZOMBIES[Math.floor(Math.random() * ZOMBIES.length)];
                            battle.zombies.push({...nz, curHp: nz.hp});
                        } else if(battle.mode === '60seconds') {
                            battle.zombies.push({...ZOMBIES[0], curHp: ZOMBIES[0].hp});
                        }
                    }
                }
                
                renderBattle();
            });
        }
        
        function exitBattle() {
            clearAllCooldowns();
            if(battle.timerInterval) {
                clearInterval(battle.timerInterval);
                battle.timerInterval = null;
            }
            battle.mode = null;
            switchTab('main');
        }    }

                if(w&&!target.weapons.some(wp=>wp.name.toLowerCase()===w.name.toLowerCase())) {
                    target.weapons.push({name:w.name,durability:w.maxDur,skin:null});
                    if(saveTarget()) { notify('✅ Выдано: '+w.name,'success');Logger.add('ADMIN_GIVE_WEP',w.name+' to '+target.id); }
                } else notify('❌ Не найдено или уже есть','error');
            } else notify('❌ Введите название','error');
        });
        
        document.getElementById('reset-player').addEventListener('click',()=>{
            if(target&&confirm('Сбросить игрока?')) {
                const D={id:target.id,name:'Gin Zar',avatar:'🧟',money:1000,rainbowMoney:0,weapons:[{name:'Нож кухонный',durability:-1,skin:null}],units:[],level:1,exp:0,createdAt:target.createdAt};
                target={...D};
                if(saveTarget()) { notify('✅ Сброшен','success');Logger.add('ADMIN_RESET',target.id); }
            }
        });
        
        document.getElementById('delete-player').addEventListener('click',()=>{
            if(target&&key&&confirm('УДАЛИТЬ навсегда?')) {
                try {
                    localStorage.removeItem(key);
                    localStorage.removeItem(PLAYERS_PREFIX+target.id);
                    adminData.bannedIds=adminData.bannedIds.filter(id=>id!==target.id);
                    adminData.testers=adminData.testers.filter(id=>id!==target.id);
                    saveAdmin();
                    target=null;key=null;
                    document.getElementById('admin-stats').innerHTML='✅ Удалён';
                    refreshPlayers();
                    notify('✅ Удалён','success');
                    Logger.add('ADMIN_DELETE',target?.id||'?');
                } catch(e) { notify('❌ Ошибка удаления','error'); }
            }
        });
        
        document.getElementById('refresh-logs').addEventListener('click',()=>{Logger.init();Logger.render(document.getElementById('logs-list'));});
        document.getElementById('clear-logs').addEventListener('click',()=>{if(confirm('Очистить все логи?')){Logger.clear();Logger.render(document.getElementById('logs-list'));notify('✅ Логи очищены','success');}});
        
        Logger.render(document.getElementById('logs-list'));
    }
}

// Start - prevent multiple calls
if(!window.gameInitialized) {
    window.onload = startGame;
}</script>
</body>
